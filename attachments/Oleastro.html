<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Oleastro — 3D</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<style>
  html, body { margin: 0; height: 100%; }
  three-d-stage:not(:defined) { visibility: hidden; }
  three-d-stage { width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<three-d-stage name="oleastro" background="#e9e6df"></three-d-stage>
<script src="./three-d-stage.js"></script>
<script type="module">
import * as THREE from 'three';
import { buildTree, makeClumpGeo, makeRandom } from './tree-builder.js';

const stage = document.querySelector('three-d-stage');
await stage.ready;


const geoRnd = makeRandom(44);
const barkMat = new THREE.MeshStandardMaterial({ name: 'corteccia_oleastro', color: 0x7a6a52, roughness: 1, metalness: 0 });
const leafA = new THREE.MeshStandardMaterial({ name: 'foglia_oleastro_scura', color: 0x5e6c46, roughness: 0.72, metalness: 0 });
const leafB = new THREE.MeshStandardMaterial({ name: 'foglia_oleastro_argentata', color: 0x9fae86, roughness: 0.76, metalness: 0 });
const leafC = new THREE.MeshStandardMaterial({ name: 'foglia_oleastro_media', color: 0x7c8c60, roughness: 0.74, metalness: 0 });

const clumpGeos = [
  makeClumpGeo(THREE, 'blade', 0.34, 1, 0.55, geoRnd),
  makeClumpGeo(THREE, 'blade', 0.22, 1, 0.6, geoRnd),
  makeClumpGeo(THREE, 'blade', 0.13, 0, 0.6, geoRnd),
];

const stems = [];
const stemCount = 6;
for (let i = 0; i < stemCount; i++) {
  const ang = (i / stemCount) * Math.PI * 2 + 0.15;
  const outward = 0.85 + (i % 3) * 0.1;
  stems.push({
    origin: new THREE.Vector3(Math.cos(ang) * 0.28, 0.28, Math.sin(ang) * 0.28),
    dir: new THREE.Vector3(Math.cos(ang) * outward, 0.55, Math.sin(ang) * outward),
    length: 1.5 + (i % 2) * 0.25, radius0: 0.13, radius1: 0.08,
  });
}

const tree = buildTree(THREE, {
  seed: 44,
  name: 'oleastro',
  barkMat,
  leafMats: [leafA, leafB, leafC],
  rootFlare: { radius: 0.62, squash: 0.7 },
  stems,
  maxDepth: 3,
  branchesPerNode: 2,
  curviness: 0.3,
  lengthDecay: 0.7,
  radiusDecay: 0.58,
  foliageMode: 'anchors',
  layers: [
    { geo: clumpGeos[0], count: 4, scaleMin: 0.5, scaleMax: 0.75, spreadMul: 1.0, shellMin: 0.6, shellSpread: 0.3 },
    { geo: clumpGeos[1], count: 7, scaleMin: 0.45, scaleMax: 0.7, spreadMul: 0.95, shellMin: 0.4, shellSpread: 0.45 },
    { geo: clumpGeos[2], count: 10, scaleMin: 0.55, scaleMax: 0.85, spreadMul: 0.9, shellMin: 0.25, shellSpread: 0.6 },
  ],
});


stage.setObject(tree);
</script>
</body>
</html>
