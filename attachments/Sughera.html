<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Sughera (Quercus suber) — 3D</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<style>
  html, body { margin: 0; height: 100%; }
  three-d-stage:not(:defined) { visibility: hidden; }
  three-d-stage { width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<three-d-stage name="sughera" background="#e9e6df"></three-d-stage>
<script src="./three-d-stage.js"></script>
<script type="module">
import * as THREE from 'three';
import { buildTree, makeClumpGeo, makeRandom } from './tree-builder.js';

const stage = document.querySelector('three-d-stage');
await stage.ready;


const geoRnd = makeRandom(74);
const barkMat0 = new THREE.MeshStandardMaterial({ name: 'sughero', color: 0x8a7a5f, roughness: 1, metalness: 0 });
const leafA = new THREE.MeshStandardMaterial({ name: 'foglia_sughera_scura', color: 0x2b3d22, roughness: 0.5, metalness: 0 });
const leafB = new THREE.MeshStandardMaterial({ name: 'foglia_sughera_media', color: 0x3a4d2c, roughness: 0.5, metalness: 0 });
const leafC = new THREE.MeshStandardMaterial({ name: 'foglia_sughera_chiara', color: 0x4a5d38, roughness: 0.5, metalness: 0 });
const clumpGeos = [
  makeClumpGeo(THREE, 'ico', 0.42, 1, 0.55, geoRnd),
  makeClumpGeo(THREE, 'ico', 0.26, 1, 0.6, geoRnd),
  makeClumpGeo(THREE, 'ico', 0.15, 0, 0.6, geoRnd),
];
const tree = buildTree(THREE, {
  seed: 74, name: 'sughera', barkMat: barkMat0, leafMats: [leafA, leafB, leafC],
  rootFlare: { radius: 0.46, squash: 0.75 },
  stems: [{ origin: new THREE.Vector3(0, 0.05, 0), dir: new THREE.Vector3(0.1, 1, 0.06), length: 2.8, radius0: 0.4, radius1: 0.26 }],
  maxDepth: 3, branchesPerNode: (d) => (d === 0 ? 4 : 3), curviness: 0.2, lengthDecay: 0.68, radiusDecay: 0.56,
  foliageMode: 'envelope', envelope: { center: new THREE.Vector3(0, 6.0, 0), radiusXZ: 2.6, radiusY: 2.4 },
  layers: [
    { geo: clumpGeos[0], count: 220, scaleMin: 0.5, scaleMax: 0.8, shellMin: 0.7, shellSpread: 0.3 },
    { geo: clumpGeos[1], count: 400, scaleMin: 0.45, scaleMax: 0.75, shellMin: 0.5, shellSpread: 0.45 },
    { geo: clumpGeos[2], count: 520, scaleMin: 0.55, scaleMax: 0.9, shellMin: 0.3, shellSpread: 0.65 },
  ],
});


stage.setObject(tree);
</script>
</body>
</html>
