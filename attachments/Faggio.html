<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Faggio (Fagus sylvatica) — 3D</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<style>
  html, body { margin: 0; height: 100%; }
  three-d-stage:not(:defined) { visibility: hidden; }
  three-d-stage { width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<three-d-stage name="faggio" background="#e9e6df"></three-d-stage>
<script src="./three-d-stage.js"></script>
<script type="module">
import * as THREE from 'three';
import { buildTree, makeClumpGeo, makeRandom } from './tree-builder.js';

const stage = document.querySelector('three-d-stage');
await stage.ready;


const geoRnd = makeRandom(71);
const barkMat = new THREE.MeshStandardMaterial({ name: 'corteccia_faggio', color: 0x8f867a, roughness: 0.65, metalness: 0 });
const leafA = new THREE.MeshStandardMaterial({ name: 'foglia_faggio_scura', color: 0x33481f, roughness: 0.4, metalness: 0.03 });
const leafB = new THREE.MeshStandardMaterial({ name: 'foglia_faggio_media', color: 0x43581f, roughness: 0.4, metalness: 0.03 });
const leafC = new THREE.MeshStandardMaterial({ name: 'foglia_faggio_chiara', color: 0x556b2b, roughness: 0.42, metalness: 0.02 });
const clumpGeos = [
  makeClumpGeo(THREE, 'broad', 0.5, 1, 0.4, geoRnd),
  makeClumpGeo(THREE, 'broad', 0.3, 1, 0.45, geoRnd),
  makeClumpGeo(THREE, 'broad', 0.18, 0, 0.5, geoRnd),
];
const tree = buildTree(THREE, {
  seed: 71, name: 'faggio', barkMat, leafMats: [leafA, leafB, leafC],
  rootFlare: { radius: 0.38, squash: 0.7 },
  stems: [{ origin: new THREE.Vector3(0, 0.05, 0), dir: new THREE.Vector3(0.04, 1, 0.02), length: 3.2, radius0: 0.32, radius1: 0.2 }],
  maxDepth: 3, branchesPerNode: (d) => (d === 0 ? 5 : 3), curviness: 0.12, lengthDecay: 0.63, radiusDecay: 0.56,
  foliageMode: 'envelope', envelope: { center: new THREE.Vector3(0, 7.4, 0), radiusXZ: 2.6, radiusY: 3.0 },
  layers: [
    { geo: clumpGeos[0], count: 240, scaleMin: 0.5, scaleMax: 0.8, shellMin: 0.7, shellSpread: 0.3 },
    { geo: clumpGeos[1], count: 440, scaleMin: 0.45, scaleMax: 0.75, shellMin: 0.5, shellSpread: 0.45 },
    { geo: clumpGeos[2], count: 560, scaleMin: 0.55, scaleMax: 0.9, shellMin: 0.3, shellSpread: 0.65 },
  ],
});


stage.setObject(tree);
</script>
</body>
</html>
