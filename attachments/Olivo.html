<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Olivo (Olea europaea) — 3D</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<style>
  html, body { margin: 0; height: 100%; }
  three-d-stage:not(:defined) { visibility: hidden; }
  three-d-stage { width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<three-d-stage name="olivo" background="#e9e6df"></three-d-stage>
<script src="./three-d-stage.js"></script>
<script type="module">
import * as THREE from 'three';
import { buildTree, makeClumpGeo, makeRandom } from './tree-builder.js';

const stage = document.querySelector('three-d-stage');
await stage.ready;


const rndSetup = makeRandom(11);
const barkMat = new THREE.MeshStandardMaterial({ name: 'corteccia_olivo', color: 0x8c8168, roughness: 0.95, metalness: 0 });
const leafTop = new THREE.MeshStandardMaterial({ name: 'foglia_olivo_verde', color: 0x6b7a52, roughness: 0.7, metalness: 0 });
const leafSilver = new THREE.MeshStandardMaterial({ name: 'foglia_olivo_argentata', color: 0xafc0a0, roughness: 0.75, metalness: 0 });
const leafMid = new THREE.MeshStandardMaterial({ name: 'foglia_olivo_media', color: 0x8b9a72, roughness: 0.72, metalness: 0 });

const geoRnd = makeRandom(21);
const clumpGeos = [
  makeClumpGeo(THREE, 'blade', 0.42, 1, 0.55, geoRnd),
  makeClumpGeo(THREE, 'blade', 0.26, 1, 0.6, geoRnd),
  makeClumpGeo(THREE, 'blade', 0.15, 0, 0.6, geoRnd),
];

const tree = buildTree(THREE, {
  seed: 11,
  name: 'olivo',
  barkMat,
  leafMats: [leafTop, leafSilver, leafMid],
  rootFlare: { radius: 0.42, squash: 0.75 },
  stems: [
    { origin: new THREE.Vector3(-0.15, 0.1, 0.1), dir: new THREE.Vector3(0.4, 1, 0.15), length: 1.6, radius0: 0.22, radius1: 0.14 },
    { origin: new THREE.Vector3(0.1, 0.1, -0.15), dir: new THREE.Vector3(-0.3, 0.95, -0.35), length: 1.5, radius0: 0.19, radius1: 0.12 },
    { origin: new THREE.Vector3(0.05, 0.1, 0.2), dir: new THREE.Vector3(0.15, 1, 0.5), length: 1.3, radius0: 0.15, radius1: 0.09 },
  ],
  maxDepth: 4,
  branchesPerNode: (depth, rnd) => (depth === 0 ? 2 : 2),
  curviness: 0.22,
  lengthDecay: 0.72,
  radiusDecay: 0.6,
  foliageMode: 'anchors',
  layers: [
    { geo: clumpGeos[0], count: 5, scaleMin: 0.55, scaleMax: 0.85, spreadMul: 1.0, shellMin: 0.6, shellSpread: 0.3 },
    { geo: clumpGeos[1], count: 9, scaleMin: 0.5, scaleMax: 0.8, spreadMul: 0.95, shellMin: 0.4, shellSpread: 0.45 },
    { geo: clumpGeos[2], count: 12, scaleMin: 0.6, scaleMax: 0.95, spreadMul: 0.9, shellMin: 0.25, shellSpread: 0.6 },
  ],
});


stage.setObject(tree);
</script>
</body>
</html>
