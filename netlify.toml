[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NITRO_PRESET = "netlify"
  NODE_OPTIONS = "--max-old-space-size=4096"

[functions]
  node_bundler = "esbuild"
  included_files = ["public/**"]

# 1) Tutto il traffico su HTTPS + dominio principale (senza www)
[[redirects]]
  from = "http://lepinidigital.com/*"
  to = "https://lepinidigital.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.lepinidigital.com/*"
  to = "https://lepinidigital.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.lepinidigital.com/*"
  to = "https://lepinidigital.com/:splat"
  status = 301
  force = true

# 2) Home del dominio = agenzia B2B
[[redirects]]
  from = "https://lepinidigital.com"
  to = "https://lepinidigital.com/digitale"
  status = 301
  force = true

[[redirects]]
  from = "https://lepinidigital.com/"
  to = "https://lepinidigital.com/digitale"
  status = 301
  force = true

# Misure è un'app statica: l'URL resta /lab/misure/..., il file è la shell.
# Senza force i file veri (assets, index.html) vincono sulla rewrite.
[[redirects]]
  from = "/lab/misure"
  to = "/lab/misure/index.html"
  status = 200

[[redirects]]
  from = "/lab/misure/*"
  to = "/lab/misure/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

[[headers]]
  for = "/lab/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Dopo /lab/*: l'HTML di Misure non deve restare in cache un anno.
# Gli asset con hash restano immutabili.
[[headers]]
  for = "/lab/misure"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/lab/misure/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/lab/misure/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/lab/misure/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/lab/misure/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
