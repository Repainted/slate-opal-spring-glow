[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NITRO_PRESET = "netlify"
  NODE_OPTIONS = "--max-old-space-size=4096"

[functions]
  node_bundler = "esbuild"
  included_files = ["public/**"]

# 1) Tutto il traffico su HTTPS + dominio principale (senza www)
[[redirects]]
  from = "http://lepinidigital.com/*"
  to = "https://lepinidigital.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.lepinidigital.com/*"
  to = "https://lepinidigital.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.lepinidigital.com/*"
  to = "https://lepinidigital.com/:splat"
  status = 301
  force = true

# 2) Home del dominio = agenzia B2B
[[redirects]]
  from = "https://lepinidigital.com"
  to = "https://lepinidigital.com/digitale"
  status = 301
  force = true

[[redirects]]
  from = "https://lepinidigital.com/"
  to = "https://lepinidigital.com/digitale"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

[[headers]]
  for = "/lab/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
