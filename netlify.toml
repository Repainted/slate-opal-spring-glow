[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NITRO_PRESET = "netlify"
  NODE_OPTIONS = "--max-old-space-size=4096"

[functions]
  node_bundler = "esbuild"
  included_files = ["public/**"]

# Dominio agenzia: la home apre il B2B.
# Portale, Lab e le altre sezioni restano sugli stessi path.
# Non si applica a portaledeilepini.netlify.app.
[[redirects]]
  from = "https://lepinidigital.com"
  to = "/digitale"
  status = 301
  force = true

[[redirects]]
  from = "https://lepinidigital.com/"
  to = "/digitale"
  status = 301
  force = true

[[redirects]]
  from = "https://www.lepinidigital.com"
  to = "/digitale"
  status = 301
  force = true

[[redirects]]
  from = "https://www.lepinidigital.com/"
  to = "/digitale"
  status = 301
  force = true

[[headers]]
  for = "/lab/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
