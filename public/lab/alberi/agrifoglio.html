<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Agrifoglio (Ilex aquifolium) — 3D</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<style>
  html, body { margin: 0; height: 100%; }
  three-d-stage:not(:defined) { visibility: hidden; }
  three-d-stage { width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<three-d-stage name="agrifoglio" background="#e9e6df"></three-d-stage>
<script src="./three-d-stage.js"></script>
<script type="module">
import * as THREE from 'three';
import { buildTree, makeClumpGeo, makeRandom } from './tree-builder.js';

const stage = document.querySelector('three-d-stage');
await stage.ready;


const geoRnd = makeRandom(80);
const barkMat = new THREE.MeshStandardMaterial({ name: 'corteccia_agrifoglio', color: 0x6a6258, roughness: 0.7, metalness: 0 });
const leafA = new THREE.MeshStandardMaterial({ name: 'foglia_agrifoglio_scura', color: 0x14301a, roughness: 0.3, metalness: 0.06 });
const leafB = new THREE.MeshStandardMaterial({ name: 'foglia_agrifoglio_media', color: 0x1f3d22, roughness: 0.3, metalness: 0.05 });
const leafC = new THREE.MeshStandardMaterial({ name: 'foglia_agrifoglio_chiara', color: 0x2a4a2c, roughness: 0.32, metalness: 0.04 });
const clumpGeos = [
  makeClumpGeo(THREE, 'ico', 0.24, 1, 0.5, geoRnd),
  makeClumpGeo(THREE, 'ico', 0.15, 1, 0.55, geoRnd),
  makeClumpGeo(THREE, 'ico', 0.09, 0, 0.55, geoRnd),
];
const tree = buildTree(THREE, {
  seed: 80, name: 'agrifoglio', barkMat, leafMats: [leafA, leafB, leafC],
  rootFlare: { radius: 0.16, squash: 0.6 },
  stems: [{ origin: new THREE.Vector3(0, 0.03, 0), dir: new THREE.Vector3(0.06, 1, 0.04), length: 1.6, radius0: 0.13, radius1: 0.08 }],
  maxDepth: 3, branchesPerNode: (d) => (d === 0 ? 4 : 2), curviness: 0.1, lengthDecay: 0.62, radiusDecay: 0.56,
  foliageMode: 'envelope', envelope: { center: new THREE.Vector3(0, 3.0, 0), radiusXZ: 1.1, radiusY: 1.9 },
  layers: [
    { geo: clumpGeos[0], count: 200, scaleMin: 0.45, scaleMax: 0.7, shellMin: 0.65, shellSpread: 0.3 },
    { geo: clumpGeos[1], count: 380, scaleMin: 0.4, scaleMax: 0.65, shellMin: 0.45, shellSpread: 0.45 },
    { geo: clumpGeos[2], count: 500, scaleMin: 0.5, scaleMax: 0.8, shellMin: 0.3, shellSpread: 0.6 },
  ],
});


stage.setObject(tree);
</script>
</body>
</html>
